name: Monthly NYC Taxi Pipeline

on:
  push:
    paths:
      - "NYC Taxi Analytics Pipeline/**"
  workflow_dispatch:
  schedule:
    # Runs on the 5th day of every month at 6:00 UTC
    - cron: "0 6 5 * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('NYC_Taxi_Analytics_Pipeline/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r NYC_Taxi_Analytics_Pipeline/requirements.txt
      - name: Debug secrets presence
        run: |
          if [ -z "${{ secrets.YELLOW_TAXI_AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS KEY MISSING"
            exit 1
          fi
          echo "AWS KEY EXISTS"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.YELLOW_TAXI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.YELLOW_TAXI_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.YELLOW_TAXI_AWS_REGION }}

      - name: Run pipeline
        working-directory: NYC_Taxi_Analytics_Pipeline
        run: |
          python pipeline.py
        env:
          BUCKET_NAME: ${{ secrets.YELLOW_TAXI_BUCKET_NAME }}
          RAW_FOLDER: ${{ secrets.YELLOW_TAXI_RAW_FOLDER }}
          PROCESSED_FOLDER: ${{ secrets.YELLOW_TAXI_PROCESSED_FOLDER }}
          S3_STAGING_DIR: ${{ secrets.YELLOW_TAXI_S3_STAGING_DIR }}
          AWS_REGION: ${{ secrets.YELLOW_TAXI_AWS_REGION }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/