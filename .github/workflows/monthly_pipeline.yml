name: Monthly NYC Taxi Pipeline

on:
  push:
    paths:
      - "NYC_Taxi_Analytics_Pipeline/**"
  workflow_dispatch:
  schedule:
    # Runs on the 5th day of every month at 6:00 UTC
    - cron: "0 6 5 * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('NYC_Taxi_Analytics_Pipeline/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r NYC_Taxi_Analytics_Pipeline/requirements.txt
      - name: Debug environment
        working-directory: NYC_Taxi_Analytics_Pipeline
        run: |
          pwd
          git rev-parse HEAD
          git status
          grep -n "check_if_file_exists_in_s3" src/data_ingestion/download_tlc.py
      - name: Run pipeline
        working-directory: NYC_Taxi_Analytics_Pipeline
        run: |
          python pipeline.py
        env:
          TLC_BASE_URL: ${{ secrets.TLC_BASE_URL }}
          YELLOW_TAXI_DATASET: ${{ secrets.YELLOW_TAXI_DATASET }}
          YELLOW_TAXI_BUCKET_NAME: ${{ secrets.YELLOW_TAXI_BUCKET_NAME }}
          YELLOW_TAXI_RAW_FOLDER: ${{ secrets.YELLOW_TAXI_RAW_FOLDER }}
          YELLOW_TAXI_PROCESSED_FOLDER: ${{ secrets.YELLOW_TAXI_PROCESSED_FOLDER }}
          YELLOW_TAXI_S3_STAGING_DIR: ${{ secrets.YELLOW_TAXI_S3_STAGING_DIR }}
          YELLOW_TAXI_AWS_REGION: ${{ secrets.YELLOW_TAXI_AWS_REGION }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/